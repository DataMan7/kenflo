{% extends "base.html" %}
{% block title %}My Account | KENFLO Staff{% endblock %}
{% block content %}
<div class="container admin-wrap narrow">
  <div class="page-head"><h1>My Account</h1></div>
  <div class="panel">
    <dl class="meta-list">
      <div><dt>Name</dt><dd>{{ user.name }}</dd></div>
      <div><dt>Email</dt><dd>{{ user.email }}</dd></div>
      <div><dt>Role</dt><dd>{{ user.role|capitalize }}</dd></div>
    </dl>
  </div>
  <div class="card form-card">
    <h2>Change password</h2>
    <form method="post" action="{{ url_for('admin.account') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="current_password">Current password *</label>
      <input type="password" id="current_password" name="current_password" required>
      <label for="new_password">New password * (min 10 characters)</label>
      <input type="password" id="new_password" name="new_password" minlength="10" required>
      <button type="submit" class="btn btn-primary btn-block">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}
