# /etc/nginx/sites-available/kenflo.conf
# Nginx reverse proxy for the KENFLO Emotional Health Services website.
#
# 1) Copy to /etc/nginx/sites-available/kenflo.conf
# 2) ln -s /etc/nginx/sites-available/kenflo.conf /etc/nginx/sites-enabled/
# 3) Replace kenflo.example.com with the real domain, then:
# 4) nginx -t && systemctl reload nginx
# 5) For HTTPS: certbot --nginx -d kenflo.example.com

server {
    listen 80;
    listen [::]:80;
    server_name kenflo.example.com;   # <-- CHANGE ME

    # --- Security headers ---------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Basic hardening ----------------------------------------------------
    client_max_body_size 1m;
    server_tokens off;

    # Block common probe paths
    location ~ /(\.git|\.env|\.ht) { deny all; return 404; }

    # --- Static assets (served directly by nginx) ---------------------------
    location /static/ {
        alias /opt/kenflo/kenflo_app/kenflo/static/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Gunicorn (Flask app) over a Unix socket ----------------------------
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/kenflo/kenflo.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Gzip ----------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
